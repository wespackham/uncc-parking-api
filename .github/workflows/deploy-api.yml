name: Deploy API to droplet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'parking_api/**'
      - 'models_lgb_3h/**'
      - 'models_lgb_24h/**'
      - 'data/**'
      - 'requirements.txt'
      - 'parking-predictor.service'
      - 'parking-predictor.timer'
      - 'parking-predictor-24h.service'
      - 'parking-predictor-24h.timer'
      - 'parking-daily-report.service'
      - 'parking-daily-report.timer'
      - 'parking-export.service'
      - 'parking-export.timer'
      - 'models_lgb_v3/**'
      - 'models_lgb_v4/**'
      - 'models_lgb_24h_v2/**'
      - 'models_west_est/**'
      - 'sql/**'
      - 'parking-analytics.service'
      - 'parking-analytics.timer'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_KEY }}
          script: |
            set -e
            cd /home/ubuntu/uncc-parking-api
            sudo -u ubuntu -H git fetch origin main
            sudo -u ubuntu -H git reset --hard origin/main
            sudo -u ubuntu -H venv/bin/pip install -r requirements.txt --quiet
            # Database objects (idempotent): precomputed analytics
            sudo -u postgres psql -d parking -v ON_ERROR_STOP=1 -q < sql/analytics_snapshot.sql
            for u in parking-predictor parking-predictor-24h parking-daily-report parking-export parking-analytics; do
              cp $u.service $u.timer /etc/systemd/system/
            done
            systemctl daemon-reload
            systemctl enable parking-predictor.timer parking-predictor-24h.timer parking-daily-report.timer parking-export.timer parking-analytics.timer
            systemctl restart parking-predictor.timer parking-predictor-24h.timer parking-daily-report.timer parking-export.timer parking-analytics.timer
